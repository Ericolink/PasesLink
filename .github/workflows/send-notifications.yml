name: Envío de notificaciones

# DESACTIVADO (ver NOTIFICATIONS_CONSOLIDATION_ARCHITECTURE.md Fase 1): el
# trigger de Firestore onNotificationQueued
# (functions/src/triggers/onNotificationQueued.ts) reemplazó a este cron
# como despachador primario — procesa la cola en segundos en vez de hasta
# 10 min de latencia de polling. Se deja sin `schedule`, solo
# `workflow_dispatch` como respaldo manual, durante el período de
# transición (borrar el workflow entero en la Fase 6, no antes).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci

      - name: Procesar cola de notificaciones
        run: node scripts/send-notifications.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_APP_PASES_9E6E7: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_PASES_9E6E7 }}
