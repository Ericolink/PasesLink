name: Envío de mensajes masivos

# DESACTIVADO (ver NOTIFICATIONS_CONSOLIDATION_ARCHITECTURE.md Fase 3): el
# trigger de Firestore onMessageCampaignQueued
# (functions/src/triggers/onMessageCampaignQueued.ts) reemplazó a este cron
# como despachador primario — procesa la campaña en segundos en vez de
# hasta 10 min de latencia de polling. Se deja sin `schedule`, solo
# `workflow_dispatch` como respaldo manual, durante el período de
# transición (borrar el workflow entero en la Fase 6, no antes).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci

      - name: Procesar cola de mensajería masiva
        run: node scripts/send-mass-messages.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_APP_PASES_9E6E7: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_PASES_9E6E7 }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
