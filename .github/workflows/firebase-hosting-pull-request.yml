name: Deploy to Firebase Hosting on PR
on: pull_request

# Least-privilege explícito (hallazgo de CodeQL). pull-requests:write se
# otorga solo en build_and_preview, que es el único job que comenta el link
# de preview en la PR — validate no necesita más que leer el código.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run knip
      - run: npm run test
        env:
          # Ver el mismo comentario en firebase-hosting-merge.yml — src/firebase/config.ts
          # llama a getAuth(app) apenas se importa. En PRs de forks estos
          # secrets no están disponibles (restricción de GitHub) y el test
          # va a fallar igual — es una limitación de GitHub, no de este fix.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

  build_and_preview:
    needs: validate
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    # checks:write — FirebaseExtended/action-hosting-deploy crea un check run
    # contra el commit para reportar el estado del deploy, sin importar si es
    # canal de preview o live (ver el mismo comentario en
    # firebase-hosting-merge.yml); sin este permiso el job falla con 403
    # "Resource not accessible by integration" al margen de
    # pull-requests:write, que solo cubre el comentario del link.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci

      # firebase.json tiene un rewrite de Hosting a una Cloud Function
      # ("/e/**" -> eventJoinMeta) — action-hosting-deploy más abajo
      # necesita resolver esa función aunque este workflow no despliegue
      # Functions, lo que dispara el predeploy de functions ("npm run
      # build" -> tsc) y sin node_modules instalado tsc no encuentra
      # firebase-functions/v2/* (bug real visto en CI, ver el mismo
      # comentario en firebase-staging-deploy.yml).
      - run: npm ci --prefix functions

      # Bug real visto en CI (2026-08-14): al resolver el rewrite de arriba,
      # firebase-tools también recorre TODAS las funciones del codebase para
      # ver qué secrets (defineSecret) declara cada una, y en ese paso
      # puntual de "function discovery" hace la llamada a Secret Manager SIN
      # las credenciales que action-hosting-deploy le pasa más abajo — el
      # log de --debug mostró literalmente "No OAuth tokens found" antes del
      # 403, con la request marcada [none] de auth. Ya se confirmó por fuera
      # (gcloud) que el permiso de la cuenta de servicio está bien — esto es
      # un agujero de auth interno de la herramienta, no de IAM. Exportar
      # GOOGLE_APPLICATION_CREDENTIALS acá (mecanismo estándar de Application
      # Default Credentials) hace que CUALQUIER llamada interna de
      # firebase-tools en este job encuentre credenciales, sin depender de
      # que action-hosting-deploy las propague bien a ese code path puntual.
      - name: Autenticar credenciales de GCP (workaround bug de firebase-tools con secrets + rewrites de Hosting)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_PASES_9E6E7 }}' > /tmp/gcp-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json" >> "$GITHUB_ENV"

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # A propósito SIN SENTRY_AUTH_TOKEN acá: sin el token el plugin de
          # Vite se desactiva solo (ver vite.config.ts), así los previews de
          # PR siguen reportando errores a Sentry pero no crean un release
          # nuevo ni suben source maps por cada PR.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_PASES_9E6E7 }}'
          projectId: app-pases-9e6e7
