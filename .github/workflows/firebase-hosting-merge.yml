name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

# Least-privilege explícito (hallazgo de CodeQL) — ningún job de este
# workflow necesita escribir en el repo, channelId:live no comenta en PRs.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run knip
      - run: npm run test
        env:
          # src/firebase/config.ts llama a getAuth(app) apenas se importa —
          # cualquier test que toque (aunque sea indirectamente) src/firebase/*
          # dispara esto, aunque el test en sí no use Firebase de verdad.
          # Sin esto, "auth/invalid-api-key" tira abajo el job.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

  build_and_deploy:
    needs: validate
    runs-on: ubuntu-latest
    # GitHub Environment "production" — no cambia qué secrets ve el job (los
    # secrets de repo siguen disponibles igual), pero deja explícito en la
    # UI de Actions/Environments qué proyecto recibe cada deploy, en
    # espejo con `environment: staging` de firebase-staging-deploy.yml.
    environment: production
    # checks:write — FirebaseExtended/action-hosting-deploy crea un check run
    # contra el commit para reportar el estado del deploy (channelId: live
    # incluido, no es exclusivo del comentario de preview en PRs); sin este
    # permiso la API de GitHub responde 403 "Resource not accessible by
    # integration" y el job entero falla. Mismo criterio de permiso acotado
    # por job que pull-requests:write en firebase-hosting-pull-request.yml.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci

      # firebase.json tiene un rewrite de Hosting a una Cloud Function
      # ("/e/**" -> eventJoinMeta) — action-hosting-deploy más abajo
      # necesita resolver esa función aunque este workflow no despliegue
      # Functions, lo que dispara el predeploy de functions ("npm run
      # build" -> tsc) y sin node_modules instalado tsc no encuentra
      # firebase-functions/v2/* (bug real visto en CI, ver el mismo
      # comentario en firebase-staging-deploy.yml).
      - run: npm ci --prefix functions

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Solo en este workflow (deploy real a producción) — no en el de
          # preview de PRs, para no crear un release de Sentry por cada PR.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_PASES_9E6E7 }}'
          channelId: live
          projectId: app-pases-9e6e7

  # Job aparte en vez de un paso dentro de build_and_deploy: así también
  # avisa si lo que falla es `validate` (lint/tsc/test), no solo el build.
  # `if: failure()` a nivel de job dispara si CUALQUIERA de `needs` falló.
  notify_failure:
    needs: [validate, build_and_deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Discord
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **Deploy de PaseLink falló** — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
