name: Recordatorios de RSVP

# DESACTIVADO (ver NOTIFICATIONS_CONSOLIDATION_ARCHITECTURE.md Fase 2): la
# Cloud Function programada sendRsvpReminders
# (functions/src/scheduled/sendRsvpReminders.ts) reemplazó a este cron —
# mismo horario (13:00 UTC), ahora con Secret Manager en vez de secrets de
# GitHub Actions. Se deja sin `schedule`, solo `workflow_dispatch` como
# respaldo manual, durante el período de transición (borrar el workflow
# entero en la Fase 6, no antes).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci

      - name: Enviar recordatorios de RSVP pendientes
        run: node scripts/send-rsvp-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_APP_PASES_9E6E7: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_PASES_9E6E7 }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
